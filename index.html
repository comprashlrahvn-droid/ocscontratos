<style>
:root{--bg:#f5f6f8;--s:#ffffff;--s2:#f3f4f6;--s3:#eceef1;--bd:#e2e5ea;--ac:#1f7a52;--red:#c0392b;--yel:#b7791f;--tx:#1c2430;--tx2:#4a5565;--tx3:#8791a0;--vg:#1f7a52;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'DM Sans',sans-serif;margin:0;font-weight:600}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 28px;background:var(--s);border-bottom:1px solid var(--bd)}
header h1{color:var(--tx);font-family:Syne,sans-serif;font-size:1.1rem;font-weight:800;letter-spacing:-.01em}
header .u{margin-left:auto;font-size:.82rem;color:var(--tx2);display:flex;gap:10px;align-items:center}
nav{display:flex;gap:2px;flex-wrap:wrap;padding:0 22px;background:var(--s);border-bottom:1px solid var(--bd)}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--tx3);padding:12px 13px;cursor:pointer;font:500 .85rem 'DM Sans',sans-serif}
nav button:hover{color:var(--tx)}nav button.on{color:var(--ac);border-bottom-color:var(--ac)}
main{padding:28px;max-width:1120px;margin:0 auto}
.card{background:var(--s);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:14px}.row>div{flex:1;min-width:140px}
label{display:block;font-size:.75rem;font-weight:500;color:var(--tx2);margin-bottom:5px}
input,select,textarea{width:100%;background:var(--s);border:1px solid var(--bd);color:var(--tx);padding:9px 12px;border-radius:8px;font:.86rem 'DM Sans',sans-serif;outline:0;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(31,122,82,.12)}
.btn{background:var(--vg);color:#fff;border:1px solid var(--vg);padding:8px 16px;border-radius:8px;font:500 .82rem 'DM Sans',sans-serif;cursor:pointer;white-space:nowrap;transition:background .15s}
.btn:hover{background:#186341}.btn.g{background:var(--s);color:var(--tx);border-color:var(--bd)}.btn.g:hover{background:var(--s2)}
.btn.r{background:var(--s);color:var(--red);border-color:#f0c9c4}.btn.r:hover{background:#fdf0ee}.btn.s{padding:5px 11px;font-size:.76rem}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.84rem}
th{text-align:left;color:var(--tx3);font-weight:500;font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;padding:9px 10px;border-bottom:1px solid var(--bd)}td{padding:10px;border-bottom:1px solid var(--s3)}
tr:last-child td{border-bottom:0}tbody tr:hover td{background:#fafbfc}
.q{width:84px}.tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.72rem;font-weight:500;background:var(--s3);color:var(--tx2)}
.t-pendente{background:#fdf3dc;color:#8a5a00}.t-validada{background:#e3f3ea;color:#17613f}.t-enviada{background:#e6edf8;color:#1d4a8a}.t-sem{background:#fbe5e2;color:#a1271c}
.mut{color:var(--tx3);font-size:.8rem}.empty{text-align:center;color:var(--tx3);padding:32px}
.sc{max-height:300px;overflow-y:auto;border:1px solid var(--bd);border-radius:10px}.sc th{position:sticky;top:0;background:var(--s);z-index:1}

#login .lbg::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 95% at 50% 48%,transparent 58%,rgba(2,26,17,.5))}
.lslogan{position:absolute;z-index:1;left:14%;top:22%;width:20%;color:#f1fff8;font-weight:600;font-size:calc(var(--W)*.0079);letter-spacing:.24em;line-height:1.75;text-transform:uppercase;text-shadow:0 1px 10px rgba(0,0,0,.4)}
.lslogan b{color:#2cf0a3;font-weight:700}
.lslogan::after,.lslogan2::after{content:'';display:block;width:2.8em;height:.3em;border-radius:3px;background:#2cf0a3;margin-top:1.3em;box-shadow:0 0 12px rgba(44,240,163,.7)}
.lslogan2{display:none;max-width:24em;text-align:center;color:#f1fff8;font-weight:600;font-size:.74rem;letter-spacing:.2em;line-height:1.7;text-transform:uppercase;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.lslogan2 b{color:#2cf0a3;font-weight:700}.lslogan2::after{margin:1em auto 0}
.lcol{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:1.6em}
/* Cartão: medidas em "em", na proporção da nova arte (cartão = 24% da largura da imagem) */
.lcard{position:relative;font-size:clamp(12px,calc(var(--W)*.0093),17.5px);width:26.7em;max-width:calc(100vw - 32px);padding:1.65em 2.5em 1.9em;border-radius:1.5em;border:1.5px solid rgba(60,235,170,.7);background:linear-gradient(180deg,rgba(7,56,38,.88),rgba(1,26,17,.93) 55%,rgba(0,20,13,.95));box-shadow:0 0 0 1px rgba(46,230,166,.12),0 0 2.4em rgba(34,214,148,.28),0 2em 5em rgba(0,0,0,.55);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);animation:lsup .5s ease}
@keyframes lsup{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.llogo{text-align:center;margin-bottom:.35em}.llogo img{height:5.3em;width:auto;filter:drop-shadow(0 .3em 1em rgba(0,0,0,.45))}
.lhead{display:flex;align-items:center;gap:1em;margin:.15em 0 1.25em}.lhico{flex:none;width:3.7em;height:3.7em;border-radius:50%;display:grid;place-items:center;color:#032a1a;background:radial-gradient(circle at 34% 28%,#52f5b6,#16a572 72%);box-shadow:0 0 1.3em rgba(46,230,166,.4),inset 0 0 0 1px rgba(255,255,255,.22)}.lhico svg{width:2em;height:2em}.lht{font-weight:700;font-size:1.36em;line-height:1.2;color:#f4fffa;letter-spacing:-.012em}.lfoot{text-align:center;font-size:.8em;color:#e1f7ee;margin:1.15em 0 0}
.lsub{text-align:center;color:#ecfff7;font-size:1.03em;margin:.1em 0 1.55em}
.ltabs{display:flex;gap:.25em;padding:.18em;margin-bottom:1.15em;border-radius:.85em;background:rgba(2,36,24,.85);border:1px solid rgba(46,230,166,.22)}
.ltab{flex:1;height:2.55em;padding:0;border-radius:.65em;border:1px solid transparent;cursor:pointer;font:600 .87em 'DM Sans',sans-serif;color:#78bfa0;background:none;transition:all .15s}
.ltab.active{background:linear-gradient(180deg,#14935f,#0d6c45);color:#fff;border-color:#3be9a8;box-shadow:0 0 1em rgba(46,230,166,.25)}
.ltc{display:none}.ltc.active{display:block}
.lfield{position:relative;margin-bottom:.85em}
.lfield>svg{position:absolute;left:1em;top:50%;transform:translateY(-50%);width:1.45em;height:1.45em;color:#e3f5ec;pointer-events:none}
.linput{width:100%;height:3.33em;padding:0 3.4em 0 3.6em;border-radius:.9em;border:1.5px solid rgba(46,230,166,.5);background:rgba(3,40,27,.88);color:#f1fff9;font:.87em 'DM Sans',sans-serif;outline:0;transition:border-color .15s,box-shadow .15s}
.linput::placeholder{color:#b7d8c9}.linput:focus{border-color:#43f6b0;box-shadow:0 0 0 3px rgba(67,246,176,.18)}
.linput:-webkit-autofill{-webkit-text-fill-color:#f1fff9;-webkit-box-shadow:0 0 0 40px #043424 inset}
select.linput{appearance:none;cursor:pointer}
.ltpw{position:absolute;right:.5em;top:50%;transform:translateY(-50%);width:2.4em;height:2.4em;border:0;background:none;color:#e3f5ec;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ltpw svg{width:1.45em;height:1.45em}.ltpw .e2{display:none}.ltpw.off .e1{display:none}.ltpw.off .e2{display:block}
.lrem{position:relative;display:flex;align-items:center;gap:.7em;margin:.95em 0 1.1em;color:#e1f7ee;font-size:.87em;cursor:pointer;user-select:none}
.lrem input{position:absolute;opacity:0;width:0;height:0}
.lck{width:1.5em;height:1.5em;border-radius:.42em;border:1.5px solid rgba(46,230,166,.6);background:rgba(3,40,27,.85);flex:none}
.lrem input:checked+.lck{background:#43f0ab;border-color:#43f0ab}
.lrem input:checked+.lck::after{content:'';display:block;width:.4em;height:.74em;border:solid #04301f;border-width:0 .17em .17em 0;transform:rotate(45deg);margin:.13em 0 0 .5em}
.lrem input:focus-visible+.lck{box-shadow:0 0 0 3px rgba(67,246,176,.3)}
.lbtn{width:100%;height:2.65em;border:0;border-radius:.75em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.6em;background:linear-gradient(180deg,#52f5b6,#25d48d);color:#032a1a;font:700 1.13em 'DM Sans',sans-serif;box-shadow:0 .5em 1.6em rgba(39,213,143,.38);transition:transform .12s,box-shadow .12s}
.lbtn svg{width:1.2em;height:1.2em}
.lbtn:hover{transform:translateY(-1px);box-shadow:0 .7em 1.9em rgba(39,213,143,.5)}.lbtn:active{transform:none}
.lerror{display:none;margin-top:1em;padding:.7em 1em;border-radius:.7em;font-size:.82em;line-height:1.4;background:rgba(255,90,90,.12);border:1px solid rgba(255,110,110,.45);color:#ff9d9d}
.llink{text-align:center;margin-top:1.1em}.llink a{color:#2cf0a3;font-size:.8em;text-decoration:underline;text-underline-offset:3px}
.lnote{font-size:.8em;color:#8fcbb0;margin:.2em 0 1em;line-height:1.4}

/* ===== TEMA AURORA — identidade visual do sistema (referência: tela de login) ===== */
:root{--bg:#eef4f1;--s:#ffffff;--s2:#f3f8f5;--s3:#e5eee9;--bd:#d9e6df;--ac:#0f9a66;--mint:#43f0ab;--vg:#0d7c52;--red:#d64545;--yel:#b7791f;--tx:#0f2a20;--tx2:#3b5a4b;--tx3:#78948a;--d1:#031a11;--d2:#062a1d;--d3:#0a4a33}
body{background:radial-gradient(900px 420px at 92% -8%,rgba(67,240,171,.22),transparent 62%),radial-gradient(800px 520px at -6% 8%,rgba(15,154,102,.12),transparent 60%),var(--bg);background-attachment:fixed;color:var(--tx)}
.vnmark{position:fixed;right:1.5vw;top:128px;width:min(660px,92vw,calc(100vh - 150px));aspect-ratio:1/1;z-index:0;pointer-events:none;opacity:.95}
.vnmark svg{width:100%;height:100%;overflow:visible;display:block}
.vnmark .sil{fill:rgba(15,154,102,.07);stroke:rgba(15,154,102,.42);stroke-width:1.5;stroke-linejoin:round}
.vnmark .sil.g{fill:rgba(15,154,102,.16)}
.vnmark .rail{fill:none;stroke:rgba(15,154,102,.55);stroke-width:.8;stroke-dasharray:1.5 5;stroke-linecap:round}
@media(max-width:720px){.vnmark{opacity:.55;top:120px}}

.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(120deg,var(--d1) 0%,var(--d2) 55%,var(--d3) 100%);border-bottom:1px solid rgba(67,240,171,.28);box-shadow:0 12px 34px -14px rgba(3,26,17,.6)}

header{display:flex;align-items:center;gap:14px;flex-wrap:nowrap;padding:16px 28px 4px;background:none;border:0}

nav button:hover{background:rgba(255,255,255,.09);color:#fff}
nav button.on{background:linear-gradient(180deg,#52f5b6,#25d48d);color:#032a1a;box-shadow:0 0 18px rgba(67,240,171,.4)}
main{position:relative;z-index:1;max-width:1180px;padding:26px 28px 70px}
.card{border-radius:18px;border:1px solid rgba(8,70,48,.08);background:rgba(255,255,255,.88);box-shadow:0 1px 2px rgba(6,40,28,.05),0 16px 36px -18px rgba(6,70,48,.25);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.btn{background:linear-gradient(180deg,#4cf2b0,#22d08a);color:#032a1a;border:0;font-weight:700;border-radius:10px;box-shadow:0 4px 14px -4px rgba(34,208,138,.55)}
.btn:hover{background:linear-gradient(180deg,#5bf6ba,#2ee094);box-shadow:0 6px 20px -4px rgba(34,208,138,.7)}
.btn.g{background:#fff;color:var(--tx);border:1px solid var(--bd);box-shadow:none;font-weight:600}.btn.g:hover{background:var(--s2);border-color:#c3d8cd}
.btn.r{background:#fff;color:var(--red);border:1px solid #f0c9c9;box-shadow:none;font-weight:600}.btn.r:hover{background:#fdf0f0}
input,select,textarea{background:#fff;border:1px solid var(--bd);border-radius:11px;color:var(--tx)}
input:focus,select:focus,textarea:focus{border-color:#22d08a;box-shadow:0 0 0 4px rgba(67,240,171,.22)}
th{background:transparent;color:var(--tx3);font-size:.7rem;letter-spacing:.06em;border-bottom:1px solid var(--bd)}
td{border-bottom:1px solid #edf3f0}tbody tr:hover td{background:#f1faf6}
.sc{border-radius:14px;border-color:var(--bd);background:#fff}.sc th{background:#f6fbf8}
.tag{background:#e8f1ec;color:var(--tx2)}.t-validada{background:#d6f8e8;color:#0a6a45}
#toast{background:linear-gradient(180deg,#073223,#04210f);color:#eafff5;border:1px solid rgba(67,240,171,.55);border-radius:12px;box-shadow:0 12px 34px rgba(3,26,17,.4),0 0 18px rgba(67,240,171,.2);font-size:.88rem;z-index:80}

function csvLinhas(t){const L0=t.split(/\r?\n/).find(l=>l.trim())||'',cnt=s=>L0.split(s).length-1,sep=cnt(';')>0&&cnt(';')>=cnt(',')&&cnt(';')>=cnt('\t')?';':cnt('\t')>cnt(',')?'\t':',';
 const R=[];let r=[],c='',q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch==='"')q=true;
  else if(ch===sep){r.push(c);c=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';R.push(r);r=[]}
  else c+=ch}
 if(c!==''||r.length){r.push(c);R.push(r)}
 return R.map(r=>r.map(x=>x.trim())).filter(r=>r.some(x=>x))}
async function lerTabela(f){const nm=f.name.toLowerCase();
 if(/\.xlsx?$/.test(nm)){if(!window.XLSX)throw new Error('Leitor de Excel indisponível. Salve a planilha como CSV e tente de novo.');
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''}).map(r=>r.map(x=>String(x).trim())).filter(r=>r.some(x=>x))}
 const buf=await f.arrayBuffer();let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){t=new TextDecoder('windows-1252').decode(buf)}
 return csvLinhas(t.replace(/^\ufeff/,''))}
