<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><script src="config.js"></script>
<title>Vila Nova — Pedidos e Ordens de Compra</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f8;--s:#ffffff;--s2:#f3f4f6;--s3:#eceef1;--bd:#e2e5ea;--ac:#1f7a52;--red:#c0392b;--yel:#b7791f;--tx:#1c2430;--tx2:#4a5565;--tx3:#8791a0;--vg:#1f7a52;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'DM Sans',sans-serif;margin:0;font-weight:600}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 28px;background:var(--s);border-bottom:1px solid var(--bd)}
header h1{color:var(--tx);font-family:Syne,sans-serif;font-size:1.1rem;font-weight:800;letter-spacing:-.01em}
header .u{margin-left:auto;font-size:.82rem;color:var(--tx2);display:flex;gap:10px;align-items:center}
nav{display:flex;gap:2px;flex-wrap:wrap;padding:0 22px;background:var(--s);border-bottom:1px solid var(--bd)}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--tx3);padding:12px 13px;cursor:pointer;font:500 .85rem 'DM Sans'}
nav button:hover{color:var(--tx)}nav button.on{color:var(--ac);border-bottom-color:var(--ac)}
main{padding:28px;max-width:1120px;margin:0 auto}
.card{background:var(--s);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:14px}.row>div{flex:1;min-width:140px}
label{display:block;font-size:.75rem;font-weight:500;color:var(--tx2);margin-bottom:5px}
input,select,textarea{width:100%;background:var(--s);border:1px solid var(--bd);color:var(--tx);padding:9px 12px;border-radius:8px;font:.86rem 'DM Sans';outline:0;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(31,122,82,.12)}
.btn{background:var(--vg);color:#fff;border:1px solid var(--vg);padding:8px 16px;border-radius:8px;font:500 .82rem 'DM Sans';cursor:pointer;white-space:nowrap;transition:background .15s}
.btn:hover{background:#186341}.btn.g{background:var(--s);color:var(--tx);border-color:var(--bd)}.btn.g:hover{background:var(--s2)}
.btn.r{background:var(--s);color:var(--red);border-color:#f0c9c4}.btn.r:hover{background:#fdf0ee}.btn.s{padding:5px 11px;font-size:.76rem}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.84rem}
th{text-align:left;color:var(--tx3);font-weight:500;font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;padding:9px 10px;border-bottom:1px solid var(--bd)}td{padding:10px;border-bottom:1px solid var(--s3)}
tr:last-child td{border-bottom:0}tbody tr:hover td{background:#fafbfc}
.q{width:84px}.tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.72rem;font-weight:500;background:var(--s3);color:var(--tx2)}
.t-pendente{background:#fdf3dc;color:#8a5a00}.t-validada{background:#e3f3ea;color:#17613f}.t-enviada{background:#e6edf8;color:#1d4a8a}.t-sem{background:#fbe5e2;color:#a1271c}
.mut{color:var(--tx3);font-size:.8rem}.empty{text-align:center;color:var(--tx3);padding:32px}
#login{--s:#122b1f;--s2:#183826;--s3:#1e4530;--bd:#2a5c3e;--ac:#2ecc71;--tx:#eaf5ee;--tx3:#5a8069;--red:#e74c3c}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0d3b20 0%,#1a5c38 50%,#c0392b 100%);position:relative;overflow:hidden}
#login::before{content:'';position:absolute;width:500px;height:500px;border-radius:50%;background:rgba(255,255,255,.04);top:-180px;right:-180px}
#login::after{content:'';position:absolute;width:360px;height:360px;border-radius:50%;background:rgba(255,255,255,.04);bottom:-130px;left:-130px}
.lcard{background:var(--s);border:1px solid var(--bd);border-radius:14px;padding:44px 40px;width:420px;max-width:calc(100vw - 32px);box-shadow:0 20px 60px rgba(0,0,0,.6);position:relative;z-index:1;animation:lsup .4s ease}
@keyframes lsup{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.ltabs{display:flex;background:var(--s2);padding:3px;border-radius:9px;margin-bottom:22px;gap:2px}
.ltab{flex:1;padding:7px 10px;border-radius:7px;border:0;cursor:pointer;font:500 .8rem 'DM Sans';color:var(--tx3);background:none}
.ltab.active{background:var(--s3);color:var(--tx)}
.linput{width:100%;background:var(--s2);border:1px solid var(--bd);color:var(--tx);padding:10px 14px;border-radius:8px;font:.88rem 'DM Sans';outline:0;margin-bottom:12px}
.linput:focus{border-color:var(--ac)}
.lbtn{width:100%;padding:11px;background:var(--ac);color:#000;border:0;border-radius:8px;font:600 .9rem 'DM Sans';cursor:pointer;margin-top:4px}.lbtn:hover{background:#00e07a}
.lerror{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);color:var(--red);padding:9px 13px;border-radius:7px;font-size:.8rem;margin-top:10px;display:none}
.ltc{display:none}.ltc.active{display:block}.lpwrap{position:relative;margin-bottom:12px}.lpwrap .linput{margin-bottom:0;padding-right:42px}
.ltpw{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;color:var(--tx3);font-size:.9rem}
.lrem{display:flex;align-items:center;gap:8px;margin:10px 0 16px;font-size:.8rem;color:var(--tx3)}.lrem input{width:auto;accent-color:var(--ac)}.lrem label{margin:0;font-size:.8rem;color:var(--tx3)}
.paper{background:#fff;color:#111;font-family:Georgia,serif;font-size:.92rem;line-height:1.55;padding:36px 40px;border-radius:6px;max-width:820px;margin:0 auto}
.paper h2{font-family:Georgia,serif;text-align:center;font-size:1.15rem;margin:0 0 4px;color:#111}.paper table{width:100%;border-collapse:collapse;margin:12px 0;font-size:.82rem}.paper th,.paper td{border:1px solid #999;padding:5px 8px;text-align:left;color:#111}.paper th{background:#eee}.paper .tx{white-space:pre-wrap}
#sign{min-height:100vh;padding:20px;background:var(--bg)}#printArea{display:none}
canvas.sg{background:#fff;border-radius:6px;width:100%;max-width:420px;height:130px;touch-action:none;border:1px solid #999;display:block;margin-bottom:6px}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important}body{background:#fff}.paper{padding:0;max-width:none}}
#toast{position:fixed;bottom:20px;right:20px;background:var(--s3);border:1px solid var(--ac);padding:10px 16px;border-radius:8px;display:none;z-index:9}
.dot{width:8px;height:8px;border-radius:50%;background:var(--yel);display:inline-block}
</style></head><body>

<div style="font-family:Syne,sans-serif;font-size:1.25rem;font-weight:800;color:var(--ac);margin-top:10px">Vila Nova</div><div style="font-size:.78rem;color:var(--tx3)">Pedidos e Ordens de Compra</div></div>

<div id="ltc-login" class="ltc active"><input class="linput" type="email" id="loginEmail" placeholder="seu@email.com">
<div class="lpwrap"><input class="linput" type="password" id="loginPassword" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"><button class="ltpw" onclick="togglePw('loginPassword',this)">👁</button></div>
<div class="lrem"><input type="checkbox" id="rememberMe"><label for="rememberMe">Manter conectado</label></div><button class="lbtn" onclick="doLogin()">Entrar</button><div class="lerror" id="loginError"></div></div>
<div id="ltc-register" class="ltc"><input class="linput" id="regName" placeholder="Nome completo"><input class="linput" type="email" id="regEmail" placeholder="seu@email.com">
<input class="linput" id="regSetor" placeholder="Setor (ex.: Farmácia, Nutrição)">

<select class="linput" id="regRole"><option value="user">Solicitante</option><option value="admin">Administrador (Compras)</option></select>

<script>
// ===== CONFIG =====
const GS=window.GS_URL||''; // definido em config.js
if(!/^https:/.test(GS))setTimeout(()=>alert('Configure o link do Apps Script no arquivo config.js'),400);
const SH={cats:'vn_categorias',forn:'vn_fornecedores',prods:'vn_produtos',acordos:'vn_acordos',pedidos:'vn_pedidos',ocs:'vn_ocs',contratos:'vn_contratos'};
const D={cats:[],forn:[],prods:[],acordos:[],pedidos:[],ocs:[],contratos:[]};let U={},tab='',cart={},rf={},DBOK=true;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const b64=s=>btoa(unescape(encodeURIComponent(s)));
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3200)}
// ===== BANCO (Apps Script / Google Sheets) =====
async function gs(p){const r=await fetch(GS+'?'+new URLSearchParams(p),{redirect:'follow'});return r.json()}
async function gsPost(b){const r=await fetch(GS,{method:'POST',body:JSON.stringify(b)});return r.json()}
async function load(k){try{const rows=await gs({action:'getAll',sheet:SH[k]});D[k]=rows.map(r=>{try{return JSON.parse(r.json)}catch(e){return null}}).filter(Boolean);
 try{localStorage.setItem('vn_'+k,JSON.stringify(D[k]))}catch(e){}}catch(e){try{D[k]=JSON.parse(localStorage.getItem('vn_'+k)||'[]')}catch(x){D[k]=[]}DBOK=false;$('#dot').style.background='#e74c3c'}}
async function save(k,o){const i=D[k].findIndex(x=>x.id===o.id),isNew=i<0;if(isNew)D[k].push(o);else D[k][i]=o;
 try{localStorage.setItem('vn_'+k,JSON.stringify(D[k]))}catch(e){}
 if(k==='contratos'){const d={id:o.id,json:JSON.stringify(o)};try{let r=await gsPost({action:isNew?'insert':'update',sheet:SH[k],id:o.id,data:d});if(r.status==='not_found')await gsPost({action:'insert',sheet:SH[k],data:d})}catch(e){toast('Falha ao gravar contrato')}return}
 const data=b64(JSON.stringify({id:o.id,json:JSON.stringify(o)}));
 try{const r=await gs({action:isNew?'insert':'update',sheet:SH[k],id:o.id,data,enc:'b64'});if(r.status==='not_found')await gs({action:'insert',sheet:SH[k],data,enc:'b64'})}catch(e){toast('Falha ao gravar no banco')}}
async function del(k,id){D[k]=D[k].filter(x=>x.id!==id);try{await gs({action:'delete',sheet:SH[k],id})}catch(e){}}
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
// ===== LOGIN (mesma base de usuários do sistema Vila Nova: aba "usuarios") =====
const $e=(id,m,ok)=>{const e=$('#'+id);e.style.cssText='display:block'+(ok?';background:rgba(46,204,113,.1);border-color:rgba(46,204,113,.3);color:var(--ac)':'');e.textContent=m};
function switchLTab(t,el){document.querySelectorAll('.ltab').forEach(b=>b.classList.remove('active'));el.classList.add('active');$('#ltc-login').classList.toggle('active',t==='login');$('#ltc-register').classList.toggle('active',t==='register')}
function togglePw(id,b){const i=$('#'+id);i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'👁':'🙈'}
async function users(){try{const r=await gs({action:'getAll',sheet:'usuarios'});return r.map(x=>{try{return{...JSON.parse(x.json),id:x.id}}catch(e){return x}})}catch(e){return[]}}
async function doLogin(){const em=$('#loginEmail').value.trim().toLowerCase(),pw=$('#loginPassword').value;$('#loginError').style.display='none';
 if(!em||!pw)return $e('loginError','Preencha e-mail e senha.');const btn=document.querySelector('#ltc-login .lbtn');btn.textContent='Verificando...';
 const u=(await users()).find(x=>String(x.email||'').trim().toLowerCase()===em&&String(x.password||'').trim()===pw.trim());btn.textContent='Entrar';
 if(!u)return $e('loginError','E-mail ou senha incorretos.');
 if(String(u.status||'').trim().toLowerCase()!=='approved')return $e('loginError','Acesso pendente de aprovação. Contate o administrador.');
 if($('#rememberMe').checked)try{localStorage.setItem('vnUser',JSON.stringify({email:u.email,pass:u.password}))}catch(e){}
 start(u)}
async function doRegister(){const n=$('#regName').value.trim(),em=$('#regEmail').value.trim(),st=$('#regSetor').value.trim(),pw=$('#regPassword').value,role=$('#regRole').value;$('#registerError').style.display='none';
 if(!n||!em||pw.length<6||(role==='user'&&!st))return $e('registerError','Preencha todos os campos (senha mín. 6 caracteres).');
 if((await users()).some(x=>String(x.email||'').trim().toLowerCase()===em.toLowerCase()))return $e('registerError','E-mail já cadastrado.');
 const nu={id:'u_'+Date.now(),name:n,email:em,password:pw,role,setor:st,status:'pending',isCreator:'false'};
 try{const r=await gs({action:'insert',sheet:'usuarios',data:b64(JSON.stringify(nu)),enc:'b64'});r.status==='ok'?$e('registerError','✅ Cadastro solicitado! Aguarde aprovação do administrador.',1):$e('registerError','❌ Erro ao salvar: '+(r.error||'tente novamente'))}catch(e){$e('registerError','❌ Sem conexão com o banco de dados.')}}
async function lembrado(){try{const sv=JSON.parse(localStorage.getItem('vnUser'));if(!sv)return;const u=(await users()).find(x=>String(x.email||'').trim().toLowerCase()===String(sv.email).toLowerCase()&&String(x.password||'').trim()===String(sv.pass).trim());
 if(u&&String(u.status||'').trim().toLowerCase()==='approved')start(u);else if(u)localStorage.removeItem('vnUser')}catch(e){}}

function sgInit(){const cv=$('#cv'),x=cv.getContext('2d');cv.width=420;cv.height=130;x.lineWidth=2.2;x.lineCap='round';x.strokeStyle='#111';let d=false;sgDirty=false;const p=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*420/r.width,(e.clientY-r.top)*130/r.height]};

async function gerarOCs(ped){const grp={},ex=D.ocs.filter(o=>o.pedido===ped.id);ped.sem=[];
 ped.itens.forEach(i=>{const a=best(i.prod);if(a){(grp[a.forn]=grp[a.forn]||[]).push({prod:i.prod,qtd:i.qtd,valor:a.valor});return}
  const o=ex.find(o=>o.status==='pendente'&&o.itens.some(x=>x.prod===i.prod));
  if(o){(grp[o.forn]=grp[o.forn]||[]).push({prod:i.prod,qtd:i.qtd,valor:o.itens.find(x=>x.prod===i.prod).valor})}else ped.sem.push(i)});
 let n=maxOC();const ids=[];
 for(const f in grp){const itens=grp[f].map(i=>{const p=D.prods.find(x=>x.id===i.prod);return{...i,codigo:p.codigo,nome:p.nome,un:p.un}});
  let oc=ex.find(o=>o.forn===f&&o.status==='pendente');
  if(!oc)oc={id:uid('o'),num:'OC-'+String(++n).padStart(4,'0'),forn:f,pedido:ped.id,pedNum:ped.num,setor:ped.setor,data:new Date().toISOString(),status:'pendente'};
  oc.contrato=(ctVig(f)||{}).num;oc.itens=itens;oc.total=ocTot(oc);ids.push(oc.id);await save('ocs',oc)}
 for(const o of ex)if(!ids.includes(o.id)&&o.status==='pendente')await del('ocs',o.id);

 $('#main').innerHTML=`<div class="card"><h3 style="margin-bottom:14px">${o.novo?'Nova ordem de compra manual':'Editar OC'} <span class="mut">${o.num}</span></h3>
<div class="row"><div style="flex:2"><label>Fornecedor</label><select id="of_f" onchange="ocForn()">${opts('forn',o.forn)}</select></div><div><label>Data</label><input type="date" id="of_d" value="${o.data.slice(0,10)}"></div><div><label>Cond. pagamento</label><input id="of_c" value="${esc(o.cond)}"></div><div><label>Prev. entrega</label><input type="date" id="of_p" value="${esc(o.prev)}"></div></div>
<div class="tw"><table><tr><th>Código</th><th>Descrição</th><th>Un.</th><th>Qtd</th><th>Valor un.</th><th>Subtotal</th><th></th></tr>${o.itens.map((i,x)=>`<tr><td>${esc(i.codigo)}</td><td>${esc(i.nome)}</td><td>${esc(i.un)}</td><td><input class="q" type="number" step="any" value="${i.qtd}" onchange="ocSet(${x},'qtd',this.value)"></td><td><input class="q" type="number" step="0.01" value="${i.valor}" onchange="ocSet(${x},'valor',this.value)"></td><td>${brl(i.qtd*i.valor)}</td><td><button class="btn r s" onclick="ocRm(${x})">×</button></td></tr>`).join('')||'<tr><td class="empty" colspan="7">Nenhum item. Adicione abaixo.</td></tr>'}</table></div>
<div class="row" style="margin-top:14px;padding:14px;background:var(--s2);border-radius:10px"><div style="flex:2;min-width:220px"><label>Produto cadastrado</label><select id="of_pr" onchange="ocProd()"><option value="">Item avulso (digitar)</option>${D.prods.map(p=>`<option value="${p.id}">${esc(p.codigo)} — ${esc(p.nome)}</option>`).join('')}</select></div><div><label>Código</label><input id="of_ic"></div><div style="flex:2"><label>Descrição</label><input id="of_in"></div><div style="min-width:70px;flex:.5"><label>Un.</label><input id="of_iu" value="UN"></div><div><label>Qtd</label><input id="of_iq" type="number" step="any"></div><div><label>Valor un.</label><input id="of_iv" type="number" step="0.01"></div><button class="btn g" onclick="ocAdd()">+ Adicionar</button></div>
<div class="row"><div><label>Frete (R$)</label><input id="of_frete" type="number" step="0.01" value="${o.frete||0}"></div><div><label>IPI (R$)</label><input id="of_ipi" type="number" step="0.01" value="${o.ipi||0}"></div><div><label>Outros (R$)</label><input id="of_outros" type="number" step="0.01" value="${o.outros||0}"></div><div><label>Desconto (R$)</label><input id="of_desc" type="number" step="0.01" value="${o.desc||0}"></div></div>
<label>Observações</label><textarea id="of_o" rows="2">${esc(o.obs)}</textarea>
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-top:16px"><div><span class="mut">Subtotal ${brl(sub)}</span><div style="font-size:1.25rem;font-weight:600">Total ${brl(ocTot(o))}</div></div><div style="display:flex;gap:8px"><button class="btn g" onclick="go('ocs')">Cancelar</button><button class="btn g" onclick="ocSave(0)">Salvar OC</button>${U.p==='master'?'<button class="btn" onclick="ocSave(1)">Salvar e validar</button>':''}</div></div></div>`}
async function ocSave(v){ocRead();if(!OF.forn)return toast('Selecione o fornecedor');if(!OF.itens.length)return toast('Adicione ao menos um item');
 const o=OF;delete o.novo;if(String(o.data).length===10)o.data=new Date(o.data+'T12:00:00').toISOString();o.total=ocTot(o);o.contrato=(ctVig(o.forn)||{}).num;if(v&&U.p==='master'){o.status='validada';o.validadaPor=U.n}
 await save('ocs',o);toast('OC '+o.num+' salva');OF=null;go('ocs')}
// ===== VENCIMENTOS =====
const dias=d=>Math.round((new Date(d+'T00:00:00')-new Date(hoje()+'T00:00:00'))/864e5);
function vencBanner(){const A=[];D.contratos.filter(c=>c.status==='assinado'&&c.fim).forEach(c=>A.push(['Contrato '+c.num+' — '+c.fs.nome,c.fim,dias(c.fim)]));
 D.acordos.filter(a=>a.validade).forEach(a=>A.push(['Acordo '+lbl('prods',a.prod)+' — '+lbl('forn',a.forn),a.validade,dias(a.validade)]));
 const L=A.filter(x=>x[2]<=30).sort((a,b)=>a[2]-b[2]);
 return L.length?`<div class="card" style="background:#fffaf0;border-color:#ecd49a"><h3 style="margin-bottom:8px;color:#8a5a00">Vencimentos próximos (30 dias)</h3>${L.map(x=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:.85rem"><span>${esc(x[0])}</span><span class="tag ${x[2]<0?'t-sem':'t-pendente'}">${x[2]<0?'vencido há '+(-x[2])+' dia(s)':x[2]===0?'vence hoje':'vence em '+x[2]+' dia(s)'} · ${fmtD(x[1])}</span></div>`).join('')}</div>`:''}
async function checarVenc(){toast('Verificando...');try{const r=await gs({action:'checkExpiry'});toast(r.error?'Erro: '+r.error:r.enviados?'E-mail enviado aos compradores com '+r.enviados+' alerta(s)':'Nenhum novo vencimento a avisar')}catch(e){toast('Falha ao verificar')}}
const R={ped:()=>{EDP=null;cart={};OBS='';pedUI()},meus,ocs,rel,usr,cot,ctr,prods:()=>{crud('prods');impUI()},acordos:()=>{crud('acordos');$('#main').insertAdjacentHTML('afterbegin',vencBanner())},forn:()=>crud('forn'),cats:()=>crud('cats')};
</script></body></html>
