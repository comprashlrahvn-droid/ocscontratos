<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Vila Nova — Pedidos e Ordens de Compra</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1f17;--s:#122b1f;--s2:#183826;--s3:#1e4530;--bd:#2a5c3e;--ac:#2ecc71;--red:#e74c3c;--yel:#f39c12;--tx:#eaf5ee;--tx2:#8fb89e;--tx3:#5a8069;--vg:#1a5c38;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
h1,h2,h3{font-family:Syne,sans-serif;margin:0}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;background:var(--s);border-bottom:1px solid var(--bd)}
header h1{color:var(--ac);font-size:1.2rem;font-weight:800}header .u{margin-left:auto;font-size:.8rem;color:var(--tx2);display:flex;gap:10px;align-items:center}
nav{display:flex;gap:4px;flex-wrap:wrap;padding:10px 20px;background:var(--s)}
nav button{background:none;border:0;color:var(--tx3);padding:8px 14px;border-radius:8px;cursor:pointer;font:500 .85rem 'DM Sans'}
nav button.on{background:var(--s3);color:var(--ac)}
main{padding:20px;max-width:1100px;margin:0 auto}
.card{background:var(--s);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}.row>div{flex:1;min-width:140px}
label{display:block;font-size:.75rem;color:var(--tx2);margin-bottom:4px}
input,select,textarea{width:100%;background:var(--s2);border:1px solid var(--bd);color:var(--tx);padding:8px 12px;border-radius:8px;font:.85rem 'DM Sans';outline:0}
input:focus,select:focus{border-color:var(--ac)}
.btn{background:var(--vg);color:#fff;border:0;padding:8px 16px;border-radius:8px;font:500 .82rem 'DM Sans';cursor:pointer;white-space:nowrap}
.btn:hover{background:#217a49}.btn.g{background:var(--s3);color:var(--tx)}.btn.r{background:#c0392b}.btn.s{padding:4px 10px;font-size:.75rem}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.83rem}
th{text-align:left;color:var(--tx2);font-weight:500;padding:8px;border-bottom:1px solid var(--bd)}td{padding:8px;border-bottom:1px solid var(--s3)}
.q{width:80px}.tag{padding:2px 9px;border-radius:20px;font-size:.72rem;background:var(--s3)}
.t-pendente{background:rgba(243,156,18,.2);color:var(--yel)}.t-validada{background:rgba(46,204,113,.2);color:var(--ac)}.t-enviada{background:#1a5c38;color:#fff}.t-sem{background:rgba(231,76,60,.2);color:var(--red)}
.mut{color:var(--tx3);font-size:.8rem}.empty{text-align:center;color:var(--tx3);padding:28px}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0d3b20 0%,#1a5c38 50%,#c0392b 100%);position:relative;overflow:hidden}
#login::before{content:'';position:absolute;width:500px;height:500px;border-radius:50%;background:rgba(255,255,255,.04);top:-180px;right:-180px}
#login::after{content:'';position:absolute;width:360px;height:360px;border-radius:50%;background:rgba(255,255,255,.04);bottom:-130px;left:-130px}
.lcard{background:var(--s);border:1px solid var(--bd);border-radius:14px;padding:44px 40px;width:420px;max-width:calc(100vw - 32px);box-shadow:0 20px 60px rgba(0,0,0,.6);position:relative;z-index:1;animation:lsup .4s ease}
@keyframes lsup{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.ltabs{display:flex;background:var(--s2);padding:3px;border-radius:9px;margin-bottom:22px;gap:2px}
.ltab{flex:1;padding:7px 10px;border-radius:7px;border:0;cursor:pointer;font:500 .8rem 'DM Sans';color:var(--tx3);background:none}
.ltab.active{background:var(--s3);color:var(--tx)}
.linput{width:100%;background:var(--s2);border:1px solid var(--bd);color:var(--tx);padding:10px 14px;border-radius:8px;font:.88rem 'DM Sans';outline:0;margin-bottom:12px}
.linput:focus{border-color:var(--ac)}
.lbtn{width:100%;padding:11px;background:var(--ac);color:#000;border:0;border-radius:8px;font:600 .9rem 'DM Sans';cursor:pointer;margin-top:4px}.lbtn:hover{background:#00e07a}
.lerror{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);color:var(--red);padding:9px 13px;border-radius:7px;font-size:.8rem;margin-top:10px;display:none}
.ltc{display:none}.ltc.active{display:block}.lpwrap{position:relative;margin-bottom:12px}.lpwrap .linput{margin-bottom:0;padding-right:42px}
.ltpw{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;color:var(--tx3);font-size:.9rem}
.lrem{display:flex;align-items:center;gap:8px;margin:10px 0 16px;font-size:.8rem;color:var(--tx3)}.lrem input{width:auto;accent-color:var(--ac)}.lrem label{margin:0;font-size:.8rem;color:var(--tx3)}
.paper{background:#fff;color:#111;font-family:Georgia,serif;font-size:.92rem;line-height:1.55;padding:36px 40px;border-radius:6px;max-width:820px;margin:0 auto}
.paper h2{font-family:Georgia,serif;text-align:center;font-size:1.15rem;margin:0 0 4px;color:#111}.paper table{width:100%;border-collapse:collapse;margin:12px 0;font-size:.82rem}.paper th,.paper td{border:1px solid #999;padding:5px 8px;text-align:left;color:#111}.paper th{background:#eee}.paper .tx{white-space:pre-wrap}
#sign{min-height:100vh;padding:20px;background:var(--bg)}#printArea{display:none}
canvas.sg{background:#fff;border-radius:6px;width:100%;max-width:420px;height:130px;touch-action:none;border:1px solid #999;display:block;margin-bottom:6px}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important}body{background:#fff}.paper{padding:0;max-width:none}}
#toast{position:fixed;bottom:20px;right:20px;background:var(--s3);border:1px solid var(--ac);padding:10px 16px;border-radius:8px;display:none;z-index:9}
.dot{width:8px;height:8px;border-radius:50%;background:var(--yel);display:inline-block}
</style></head><body>

<div style="font-family:Syne,sans-serif;font-size:1.25rem;font-weight:800;color:var(--ac);margin-top:10px">Vila Nova</div><div style="font-size:.78rem;color:var(--tx3)">Pedidos e Ordens de Compra</div></div>
<div class="ltabs"><button class="ltab active" onclick="switchLTab('login',this)">Entrar</button><button class="ltab" onclick="switchLTab('register',this)">Cadastrar</button></div>
<div id="ltc-login" class="ltc active"><input class="linput" type="email" id="loginEmail" placeholder="seu@email.com">
<div class="lpwrap"><input class="linput" type="password" id="loginPassword" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"><button class="ltpw" onclick="togglePw('loginPassword',this)">👁</button></div>
<div class="lrem"><input type="checkbox" id="rememberMe"><label for="rememberMe">Manter conectado</label></div><button class="lbtn" onclick="doLogin()">Entrar</button><div class="lerror" id="loginError"></div></div>
<div id="ltc-register" class="ltc"><input class="linput" id="regName" placeholder="Nome completo"><input class="linput" type="email" id="regEmail" placeholder="seu@email.com">
<input class="linput" id="regSetor" placeholder="Setor (ex.: Farmácia, Nutrição)">
<div class="lpwrap"><input class="linput" type="password" id="regPassword" placeholder="Mínimo 6 caracteres"><button class="ltpw" onclick="togglePw('regPassword',this)">👁</button></div>
<select class="linput" id="regRole"><option value="user">Solicitante</option><option value="admin">Administrador (Compras)</option></select>

<script>
// ===== CONFIG =====
const GS='https://script.google.com/macros/s/AKfycbxTL6OQ_Rzdy7dP8W9lkvFlO_g4jJ4Vibvo-Pj2EzDyccNXX__6e5LQ6n8LpcC-T3sn/exec';
const SH={cats:'vn_categorias',forn:'vn_fornecedores',prods:'vn_produtos',acordos:'vn_acordos',pedidos:'vn_pedidos',ocs:'vn_ocs',contratos:'vn_contratos'};
const D={cats:[],forn:[],prods:[],acordos:[],pedidos:[],ocs:[],contratos:[]};let U={},tab='',cart={},rf={};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const b64=s=>btoa(unescape(encodeURIComponent(s)));
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3200)}
// ===== BANCO (Apps Script / Google Sheets) =====
async function gs(p){const r=await fetch(GS+'?'+new URLSearchParams(p),{redirect:'follow'});return r.json()}
async function gsPost(b){const r=await fetch(GS,{method:'POST',body:JSON.stringify(b)});return r.json()}
async function load(k){try{const rows=await gs({action:'getAll',sheet:SH[k]});D[k]=rows.map(r=>{try{return JSON.parse(r.json)}catch(e){return null}}).filter(Boolean);
 try{localStorage.setItem('vn_'+k,JSON.stringify(D[k]))}catch(e){}}catch(e){try{D[k]=JSON.parse(localStorage.getItem('vn_'+k)||'[]')}catch(x){D[k]=[]}$('#dot').style.background='#e74c3c'}}
async function save(k,o){const i=D[k].findIndex(x=>x.id===o.id),isNew=i<0;if(isNew)D[k].push(o);else D[k][i]=o;
 try{localStorage.setItem('vn_'+k,JSON.stringify(D[k]))}catch(e){}
 if(k==='contratos'){const d={id:o.id,json:JSON.stringify(o)};try{let r=await gsPost({action:isNew?'insert':'update',sheet:SH[k],id:o.id,data:d});if(r.status==='not_found')await gsPost({action:'insert',sheet:SH[k],data:d})}catch(e){toast('Falha ao gravar contrato')}return}
 const data=b64(JSON.stringify({id:o.id,json:JSON.stringify(o)}));
 try{const r=await gs({action:isNew?'insert':'update',sheet:SH[k],id:o.id,data,enc:'b64'});if(r.status==='not_found')await gs({action:'insert',sheet:SH[k],data,enc:'b64'})}catch(e){toast('Falha ao gravar no banco')}}
async function del(k,id){D[k]=D[k].filter(x=>x.id!==id);try{await gs({action:'delete',sheet:SH[k],id})}catch(e){}}
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
// ===== LOGIN (mesma base de usuários do sistema Vila Nova: aba "usuarios") =====
const $e=(id,m,ok)=>{const e=$('#'+id);e.style.cssText='display:block'+(ok?';background:rgba(46,204,113,.1);border-color:rgba(46,204,113,.3);color:var(--ac)':'');e.textContent=m};
function switchLTab(t,el){document.querySelectorAll('.ltab').forEach(b=>b.classList.remove('active'));el.classList.add('active');$('#ltc-login').classList.toggle('active',t==='login');$('#ltc-register').classList.toggle('active',t==='register')}
function togglePw(id,b){const i=$('#'+id);i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'👁':'🙈'}
async function users(){try{const r=await gs({action:'getAll',sheet:'usuarios'});return r.map(x=>{try{return{...JSON.parse(x.json),id:x.id}}catch(e){return x}})}catch(e){return[]}}
async function doLogin(){const em=$('#loginEmail').value.trim().toLowerCase(),pw=$('#loginPassword').value;$('#loginError').style.display='none';
 if(!em||!pw)return $e('loginError','Preencha e-mail e senha.');const btn=document.querySelector('#ltc-login .lbtn');btn.textContent='Verificando...';
 const u=(await users()).find(x=>String(x.email||'').trim().toLowerCase()===em&&String(x.password||'').trim()===pw.trim());btn.textContent='Entrar';
 if(!u)return $e('loginError','E-mail ou senha incorretos.');
 if(String(u.status||'').trim().toLowerCase()!=='approved')return $e('loginError','Acesso pendente de aprovação. Contate o administrador.');
 if($('#rememberMe').checked)try{localStorage.setItem('vnUser',JSON.stringify({email:u.email,pass:u.password}))}catch(e){}
 start(u)}
async function doRegister(){const n=$('#regName').value.trim(),em=$('#regEmail').value.trim(),st=$('#regSetor').value.trim(),pw=$('#regPassword').value,role=$('#regRole').value;$('#registerError').style.display='none';
 if(!n||!em||pw.length<6||(role==='user'&&!st))return $e('registerError','Preencha todos os campos (senha mín. 6 caracteres).');
 if((await users()).some(x=>String(x.email||'').trim().toLowerCase()===em.toLowerCase()))return $e('registerError','E-mail já cadastrado.');
 const nu={id:'u_'+Date.now(),name:n,email:em,password:pw,role,setor:st,status:'pending',isCreator:'false'};
 try{const r=await gs({action:'insert',sheet:'usuarios',data:b64(JSON.stringify(nu)),enc:'b64'});r.status==='ok'?$e('registerError','✅ Cadastro solicitado! Aguarde aprovação do administrador.',1):$e('registerError','❌ Erro ao salvar: '+(r.error||'tente novamente'))}catch(e){$e('registerError','❌ Sem conexão com o banco de dados.')}}
async function lembrado(){try{const sv=JSON.parse(localStorage.getItem('vnUser'));if(!sv)return;const u=(await users()).find(x=>String(x.email||'').trim().toLowerCase()===String(sv.email).toLowerCase()&&String(x.password||'').trim()===String(sv.pass).trim());
 if(u&&String(u.status||'').trim().toLowerCase()==='approved')start(u);else if(u)localStorage.removeItem('vnUser')}catch(e){}}

Fica eleito o foro da comarca de Campo Bom/RS. As partes assinam eletronicamente este instrumento.`;
const fmtD=d=>d?d.split('-').reverse().join('/'):'—',rep=(t,m)=>Object.keys(m).reduce((s,k)=>s.split('{{'+k+'}}').join(m[k]),t);
const tok=()=>Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(16).padStart(2,'0')).join('');
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join('')}
const ctLink=c=>location.href.split(/[?#]/)[0]+'?assinar='+c.id+'&t='+c.token,CS={rascunho:'Rascunho',enviado:'Aguardando assinatura',assinado:'Assinado'};
function ctDoc(c){const f=c.fs||{},a=c.assinatura,t=rep(esc(c.texto),{FORNECEDOR:esc(f.nome),CNPJ:esc(f.cnpj||'—'),VIGENCIA:fmtD(c.ini)+' a '+fmtD(c.fim),COND:esc(f.cond||'a combinar'),NUMERO:esc(c.num)});
 return `<h2>${esc(c.titulo)}</h2><p style='text-align:center;margin:0 0 14px'>Nº ${esc(c.num)}</p><div class='tx'>${t}</div><table><tr><th>Código</th><th>Descrição</th><th>Un.</th><th>Valor registrado</th></tr>${c.itens.map(i=>`<tr><td>${esc(i.codigo)}</td><td>${esc(i.nome)}</td><td>${esc(i.un)}</td><td>${brl(i.valor)}</td></tr>`).join('')}</table><p style='margin-top:22px'><b>Contratante:</b> Associação Hospitalar Vila Nova — Setor de Compras</p>${a?`<p><b>Contratada:</b> ${esc(f.nome)}<br>Assinado eletronicamente por <b>${esc(a.nome)}</b> (${esc(a.doc)}${a.cargo?', '+esc(a.cargo):''}) em ${new Date(c.assinadoEm).toLocaleString('pt-BR')}.<br>Código de verificação: ${esc(a.hash)}</p>${String(a.img).startsWith('data:image/png')?`<img src='${a.img}' style='height:64px'>`:''}`:`<p><b>Contratada:</b> ${esc(f.nome)} — <i>aguardando assinatura</i></p>`}`}
function ctPdf(x,c){c=c||D.contratos[x];$('#printArea').innerHTML=`<div class='paper'>${ctDoc(c)}</div>`;setTimeout(()=>window.print(),150)}
function ctr(){CK=null;$('#main').innerHTML=`<div class='card'><div class='row' style='margin:0'><div><h3>Contratos de fornecimento</h3><span class='mut'>Registro de preços por fornecedor, enviado para assinatura por link</span></div><div style='flex:0;display:flex;gap:6px'><select id='nf' style='width:220px'>${opts('forn')}</select><button class='btn' onclick='ctNovo()'>Novo contrato</button></div></div></div>`+(D.contratos.map((c,x)=>`<div class='card'><div class='row' style='margin:0'><div><h3>${c.num} <span class='tag t-${c.status==='assinado'?'validada':c.status==='enviado'?'pendente':'x'}'>${CS[c.status]}</span></h3><span class='mut'>${esc(c.fs.nome)} · ${fmtD(c.ini)} a ${fmtD(c.fim)} · ${c.itens.length} itens${c.status==='assinado'?' · assinado por '+esc(c.assinatura.nome):''}</span></div><div style='flex:0;display:flex;gap:6px;flex-wrap:wrap'>${c.status==='rascunho'?`<button class='btn s' onclick='ctEdit(${x})'>Editar</button><button class='btn s' onclick='ctEnviar(${x})'>Enviar</button>`:`<button class='btn s' onclick='ctCopy(${x})'>Copiar link</button>`}${c.status==='enviado'?`<button class='btn s' onclick='ctEnviar(${x})'>Reenviar</button><button class='btn g s' onclick='ctReabrir(${x})'>Reabrir edição</button>`:''}<button class='btn g s' onclick='ctPrev(${x})'>Ver</button><button class='btn g s' onclick='ctPdf(${x})'>PDF</button>${c.status==='assinado'?'':`<button class='btn r s' onclick='ctDel(${x})'>Excluir</button>`}</div></div></div>`).join('')||`<div class='empty'>Nenhum contrato ainda. Escolha um fornecedor e clique em Novo contrato.</div>`)}
async function ctNovo(){const f=$('#nf').value,F=D.forn.find(x=>x.id===f);if(!F)return toast('Selecione o fornecedor');
 const itens=D.acordos.filter(a=>a.forn===f).map(a=>{const p=D.prods.find(x=>x.id===a.prod);return p?{prod:p.id,codigo:p.codigo,nome:p.nome,un:p.un,valor:a.valor}:null}).filter(Boolean);
 const c={id:uid('t'),num:'CT-'+String(D.contratos.length+1).padStart(4,'0'),forn:f,fs:{nome:F.nome,cnpj:F.cnpj,email:F.email,cond:F.cond},titulo:'Contrato de Fornecimento com Registro de Preços',texto:CT_TXT,ini:hoje(),fim:new Date(Date.now()+365*864e5).toISOString().slice(0,10),itens,status:'rascunho',token:tok(),criado:new Date().toISOString()};
 await save('contratos',c);ctEdit(D.contratos.indexOf(c))}
let CK=null,SC=null,sgDirty=false;
function ctEdit(x){CK=D.contratos[x];ctEditUI()}
function ctEditUI(){const c=CK;$('#main').innerHTML=`<div class='card'><h3 style='margin-bottom:12px'>${c.num} — ${esc(c.fs.nome)}</h3><div class='row'><div style='flex:2'><label>Título</label><input id='ct' value='${esc(c.titulo)}'></div><div><label>Vigência (início)</label><input type='date' id='ci' value='${c.ini}'></div><div><label>Vigência (fim)</label><input type='date' id='cfim' value='${c.fim}'></div></div>
 <label>Cláusulas (editável). Variáveis: {{FORNECEDOR}} {{CNPJ}} {{VIGENCIA}} {{COND}} {{NUMERO}}</label><textarea id='cx' rows='16'>${esc(c.texto)}</textarea>
 <h3 style='margin:16px 0 8px'>Preços registrados</h3><div class='tw'><table><tr><th>Código</th><th>Item</th><th>Un.</th><th>Valor</th><th></th></tr>${c.itens.map((i,x)=>`<tr><td>${esc(i.codigo)}</td><td>${esc(i.nome)}</td><td>${esc(i.un)}</td><td><input class='q' type='number' step='0.01' value='${i.valor}' onchange='CK.itens[${x}].valor=parseFloat(this.value)||0'></td><td><button class='btn r s' onclick='ctRm(${x})'>×</button></td></tr>`).join('')||`<tr><td class='empty' colspan='5'>Sem itens. Adicione abaixo ou puxe dos acordos.</td></tr>`}</table></div>
 <div class='row' style='margin-top:10px'><div style='flex:2'><select id='ap'>${opts('prods')}</select></div><div><input id='av' type='number' step='0.01' placeholder='Valor'></div><button class='btn g' onclick='ctAdd()'>Adicionar item</button><button class='btn g' onclick='ctSync()'>Puxar dos acordos</button></div>
 <div style='display:flex;gap:8px;margin-top:14px;flex-wrap:wrap'><button class='btn' onclick='ctSave()'>Salvar rascunho</button><button class='btn g' onclick='ctSave(1)'>Pré-visualizar</button><button class='btn' onclick='ctSave(2)'>Salvar e enviar ao fornecedor</button><button class='btn g' onclick='ctr()'>Voltar</button></div></div>`}
function ctRead(){CK.titulo=$('#ct').value;CK.ini=$('#ci').value;CK.fim=$('#cfim').value;CK.texto=$('#cx').value}
function ctRm(x){ctRead();CK.itens.splice(x,1);ctEditUI()}
function ctAdd(){ctRead();const p=D.prods.find(x=>x.id===$('#ap').value),v=parseFloat($('#av').value);if(!p||!(v>=0))return toast('Escolha produto e valor');const i=CK.itens.find(i=>i.prod===p.id);i?i.valor=v:CK.itens.push({prod:p.id,codigo:p.codigo,nome:p.nome,un:p.un,valor:v});ctEditUI()}
function ctSync(){ctRead();D.acordos.filter(a=>a.forn===CK.forn).forEach(a=>{const p=D.prods.find(x=>x.id===a.prod);if(!p)return;const i=CK.itens.find(i=>i.prod===p.id);i?i.valor=a.valor:CK.itens.push({prod:p.id,codigo:p.codigo,nome:p.nome,un:p.un,valor:a.valor})});ctEditUI()}
async function ctSave(m){ctRead();const F=D.forn.find(x=>x.id===CK.forn);if(F)CK.fs={nome:F.nome,cnpj:F.cnpj,email:F.email,cond:F.cond};await save('contratos',CK);toast('Rascunho salvo');const x=D.contratos.indexOf(CK);m===1?ctPrev(x):m===2?ctEnviar(x):0}
function ctPrev(x){const c=D.contratos[x];$('#main').innerHTML=`<div style='display:flex;gap:8px;margin-bottom:12px'><button class='btn g' onclick='ctr()'>Voltar à lista</button>${c.status==='rascunho'?`<button class='btn g' onclick='ctEdit(${x})'>Editar</button>`:''}<button class='btn' onclick='ctPdf(${x})'>PDF</button></div><div class='paper'>${ctDoc(c)}</div>`}
async function ctEnviar(x){const c=D.contratos[x];if(!c.fs.email)return toast('Fornecedor sem e-mail cadastrado');if(!c.itens.length)return toast('Inclua ao menos um item');
 c.status='enviado';c.enviadoEm=new Date().toISOString();await save('contratos',c);
 try{const r=await gs({action:'sendContractEmail',data:b64(JSON.stringify({to_email:c.fs.email,to_name:c.fs.nome,num:c.num,titulo:c.titulo,link:ctLink(c),from_name:U.n})),enc:'b64'});toast(r.success?'Contrato enviado a '+c.fs.email:'Erro: '+r.error)}catch(e){toast('Falha no envio. Use Copiar link')}ctr()}
async function ctCopy(x){const l=ctLink(D.contratos[x]);try{await navigator.clipboard.writeText(l);toast('Link copiado')}catch(e){prompt('Copie o link:',l)}}
async function ctReabrir(x){if(!confirm('O link atual deixará de funcionar e o contrato volta a rascunho. Continuar?'))return;const c=D.contratos[x];c.status='rascunho';c.token=tok();await save('contratos',c);ctr()}
async function ctDel(x){if(!confirm('Excluir este contrato?'))return;await del('contratos',D.contratos[x].id);ctr()}
// ----- Página pública do fornecedor (sem login) -----
async function assinarUI(id,t){$('#login').style.display='none';const s=$('#sign');s.style.display='block';s.innerHTML=`<div class='empty'>Carregando contrato...</div>`;let c=null,err='';
 try{const r=await gs({action:'getContract',id,t});c=r.contrato;err=r.error}catch(e){err='Não foi possível acessar o servidor.'}
 if(!c)return s.innerHTML=`<div class='empty'>${esc(err||'Contrato não encontrado.')}</div>`;SC=c;signUI()}
function signUI(){const c=SC,ok=c.status==='assinado';$('#sign').innerHTML=`<div style='max-width:820px;margin:0 auto'><div style='display:flex;gap:10px;align-items:center;margin-bottom:14px'><h2 style='color:var(--ac);font-size:1.1rem'>Vila Nova — Contrato ${esc(c.num)}</h2><button class='btn g s' style='margin-left:auto' onclick='ctPdf(0,SC)'>⬇ Baixar PDF</button></div><div class='paper'>${ctDoc(c)}</div>
 ${ok?`<div class='card' style='margin-top:14px;text-align:center'>✅ Contrato assinado em ${new Date(c.assinadoEm).toLocaleString('pt-BR')}. Você pode baixar o PDF acima quando precisar.</div>`:`<div class='card' style='margin-top:14px'><h3 style='margin-bottom:10px'>Assinatura eletrônica</h3><div class='row'><div><label>Nome completo</label><input id='sn'></div><div><label>CPF/CNPJ</label><input id='sd'></div><div><label>Cargo</label><input id='sc'></div></div><label>Assine no quadro abaixo</label><canvas class='sg' id='cv'></canvas><button class='btn g s' onclick='sgClear()'>Limpar</button><div class='lrem'><input type='checkbox' id='sa'><label for='sa'>Li e aceito os termos deste contrato.</label></div><button class='btn' onclick='assinar()'>Assinar contrato</button></div>`}</div>`;if(!ok)sgInit()}
function sgInit(){const cv=$('#cv'),x=cv.getContext('2d');cv.width=420;cv.height=130;x.lineWidth=2.2;x.lineCap='round';x.strokeStyle='#111';let d=false;sgDirty=false;const p=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*420/r.width,(e.clientY-r.top)*130/r.height]};
 cv.onpointerdown=e=>{d=true;sgDirty=true;x.beginPath();x.moveTo(...p(e));cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(d){x.lineTo(...p(e));x.stroke()}};cv.onpointerup=()=>d=false}
function sgClear(){$('#cv').getContext('2d').clearRect(0,0,420,130);sgDirty=false}
async function assinar(){const n=$('#sn').value.trim(),d=$('#sd').value.trim(),k=$('#sc').value.trim();if(!n||!d)return toast('Informe nome e CPF/CNPJ');if(!sgDirty)return toast('Faça sua assinatura no quadro');if(!$('#sa').checked)return toast('Aceite os termos para assinar');
 const ts=new Date().toISOString(),h=await sha(JSON.stringify([SC.id,SC.titulo,SC.texto,SC.itens,n,d,ts])),sig={nome:n,doc:d,cargo:k,ts,hash:h.slice(0,32),img:$('#cv').toDataURL('image/png'),ua:navigator.userAgent.slice(0,120)};
 try{const r=await gsPost({action:'signContract',id:SC.id,t:SC.token,sig});if(!r.contrato)return toast(r.error||'Erro ao assinar');SC=r.contrato}catch(e){return toast('Falha ao registrar a assinatura. Tente novamente.')}signUI();toast('Contrato assinado com sucesso')}
const R={ped:pedUI,meus,ocs,rel,usr,cot,ctr,prods:()=>{crud('prods');impUI()},acordos:()=>crud('acordos'),forn:()=>crud('forn'),cats:()=>crud('cats')};
</script></body></html>
