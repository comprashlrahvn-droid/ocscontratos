<title>Vila Nova — Pedidos e Ordens de Compra</title>

<style>
:root{--bg:#f5f6f8;--s:#ffffff;--s2:#f3f4f6;--s3:#eceef1;--bd:#e2e5ea;--ac:#1f7a52;--red:#c0392b;--yel:#b7791f;--tx:#1c2430;--tx2:#4a5565;--tx3:#8791a0;--vg:#1f7a52;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'DM Sans',sans-serif;margin:0;font-weight:600}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 28px;background:var(--s);border-bottom:1px solid var(--bd)}
header h1{color:var(--tx);font-family:Syne,sans-serif;font-size:1.1rem;font-weight:800;letter-spacing:-.01em}
header .u{margin-left:auto;font-size:.82rem;color:var(--tx2);display:flex;gap:10px;align-items:center}
nav{display:flex;gap:2px;flex-wrap:wrap;padding:0 22px;background:var(--s);border-bottom:1px solid var(--bd)}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--tx3);padding:12px 13px;cursor:pointer;font:500 .85rem 'DM Sans',sans-serif}
nav button:hover{color:var(--tx)}nav button.on{color:var(--ac);border-bottom-color:var(--ac)}
main{padding:28px;max-width:1120px;margin:0 auto}
.card{background:var(--s);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:14px}.row>div{flex:1;min-width:140px}
label{display:block;font-size:.75rem;font-weight:500;color:var(--tx2);margin-bottom:5px}
input,select,textarea{width:100%;background:var(--s);border:1px solid var(--bd);color:var(--tx);padding:9px 12px;border-radius:8px;font:.86rem 'DM Sans',sans-serif;outline:0;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(31,122,82,.12)}
.btn{background:var(--vg);color:#fff;border:1px solid var(--vg);padding:8px 16px;border-radius:8px;font:500 .82rem 'DM Sans',sans-serif;cursor:pointer;white-space:nowrap;transition:background .15s}
.btn:hover{background:#186341}.btn.g{background:var(--s);color:var(--tx);border-color:var(--bd)}.btn.g:hover{background:var(--s2)}
.btn.r{background:var(--s);color:var(--red);border-color:#f0c9c4}.btn.r:hover{background:#fdf0ee}.btn.s{padding:5px 11px;font-size:.76rem}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.84rem}
th{text-align:left;color:var(--tx3);font-weight:500;font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;padding:9px 10px;border-bottom:1px solid var(--bd)}td{padding:10px;border-bottom:1px solid var(--s3)}
tr:last-child td{border-bottom:0}tbody tr:hover td{background:#fafbfc}
.q{width:84px}.tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.72rem;font-weight:500;background:var(--s3);color:var(--tx2)}
.t-pendente{background:#fdf3dc;color:#8a5a00}.t-validada{background:#e3f3ea;color:#17613f}.t-enviada{background:#e6edf8;color:#1d4a8a}.t-sem{background:#fbe5e2;color:#a1271c}
.mut{color:var(--tx3);font-size:.8rem}.empty{text-align:center;color:var(--tx3);padding:32px}
.sc{max-height:300px;overflow-y:auto;border:1px solid var(--bd);border-radius:10px}.sc th{position:sticky;top:0;background:var(--s);z-index:1}
#login{--ac:#2cf0a3;--red:#ff7b7b;--tx:#eafff5;--tx3:#7fbfa3;--bd:rgba(46,230,166,.35);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px 16px;position:relative;background:#021a11;font-family:'DM Sans',sans-serif;color:#eafff5}

/* Cartão: medidas em "em", na proporção da imagem de referência (cartão = 38,6% da largura e 49% da altura da arte) */
.lcard{position:relative;z-index:1;font-size:clamp(12px,1.296vh,18px);width:26.7em;max-width:calc(100vw - 32px);padding:1.6em 2.45em 1.9em;border-radius:1.6em;border:1.5px solid rgba(60,235,170,.7);background:linear-gradient(180deg,rgba(7,56,38,.9),rgba(1,26,17,.94) 55%,rgba(0,20,13,.96));box-shadow:0 0 0 1px rgba(46,230,166,.12),0 0 2.6em rgba(34,214,148,.28),0 2em 5em rgba(0,0,0,.6);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);animation:lsup .5s ease}
@keyframes lsup{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.llogo{text-align:center;margin-bottom:.5em}.llogo img{height:7.9em;width:auto;filter:drop-shadow(0 .3em 1em rgba(0,0,0,.5))}
.ltitle{text-align:center;font-weight:700;font-size:2.3em;letter-spacing:-.015em;line-height:1.1;background:linear-gradient(180deg,#43f6b0,#1fd48f);-webkit-background-clip:text;background-clip:text;color:transparent}
.lsub{text-align:center;color:#ecfff7;font-size:1.1em;margin:.3em 0 1.4em}
.ltabs{display:flex;gap:.25em;padding:.18em;margin-bottom:1.2em;border-radius:.9em;background:rgba(2,36,24,.85);border:1px solid rgba(46,230,166,.22)}
.ltab{flex:1;height:2.75em;padding:0;border-radius:.7em;border:1px solid transparent;cursor:pointer;font:600 .95em 'DM Sans',sans-serif;color:#78bfa0;background:none;transition:all .15s}
.ltab.active{background:linear-gradient(180deg,#14935f,#0d6c45);color:#fff;border-color:#3be9a8;box-shadow:0 0 1em rgba(46,230,166,.25)}
.ltc{display:none}.ltc.active{display:block}
.lfield{position:relative;margin-bottom:.8em}
.lfield>svg{position:absolute;left:1em;top:50%;transform:translateY(-50%);width:1.5em;height:1.5em;color:#e3f5ec;pointer-events:none}
.linput{width:100%;height:3.25em;padding:0 3.1em 0 3.3em;border-radius:.9em;border:1.5px solid rgba(46,230,166,.5);background:rgba(3,40,27,.88);color:#f1fff9;font:.95em 'DM Sans',sans-serif;outline:0;transition:border-color .15s,box-shadow .15s}
.linput::placeholder{color:#b7d8c9}.linput:focus{border-color:#43f6b0;box-shadow:0 0 0 3px rgba(67,246,176,.18)}
.linput:-webkit-autofill{-webkit-text-fill-color:#f1fff9;-webkit-box-shadow:0 0 0 40px #043424 inset}
select.linput{appearance:none;cursor:pointer}
.ltpw{position:absolute;right:.5em;top:50%;transform:translateY(-50%);width:2.4em;height:2.4em;border:0;background:none;color:#e3f5ec;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ltpw svg{width:1.5em;height:1.5em}.ltpw .e2{display:none}.ltpw.off .e1{display:none}.ltpw.off .e2{display:block}
.lrem{position:relative;display:flex;align-items:center;gap:.7em;margin:.9em 0 1.1em;color:#e1f7ee;font-size:.93em;cursor:pointer;user-select:none}
.lrem input{position:absolute;opacity:0;width:0;height:0}
.lck{width:1.4em;height:1.4em;border-radius:.4em;border:1.5px solid rgba(46,230,166,.6);background:rgba(3,40,27,.85);flex:none}
.lrem input:checked+.lck{background:#43f0ab;border-color:#43f0ab}
.lrem input:checked+.lck::after{content:'';display:block;width:.36em;height:.68em;border:solid #04301f;border-width:0 .16em .16em 0;transform:rotate(45deg);margin:.12em 0 0 .45em}
.lrem input:focus-visible+.lck{box-shadow:0 0 0 3px rgba(67,246,176,.3)}
.lbtn{width:100%;height:2.5em;border:0;border-radius:.7em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.6em;background:linear-gradient(180deg,#52f5b6,#25d48d);color:#032a1a;font:700 1.25em 'DM Sans',sans-serif;box-shadow:0 .5em 1.6em rgba(39,213,143,.38);transition:transform .12s,box-shadow .12s}
.lbtn svg{width:1.2em;height:1.2em}
.lbtn:hover{transform:translateY(-1px);box-shadow:0 .7em 1.9em rgba(39,213,143,.5)}.lbtn:active{transform:none}
.lerror{display:none;margin-top:1em;padding:.7em 1em;border-radius:.7em;font-size:.82em;line-height:1.4;background:rgba(255,90,90,.12);border:1px solid rgba(255,110,110,.45);color:#ff9d9d}
.llink{text-align:center;margin-top:1.1em}.llink a{color:#2cf0a3;font-size:.82em;text-decoration:underline;text-underline-offset:3px}
.lnote{font-size:.8em;color:#8fcbb0;margin:.2em 0 1em;line-height:1.4}

.paper{background:#fff;color:#111;font-family:Georgia,serif;font-size:.92rem;line-height:1.55;padding:36px 40px;border-radius:6px;max-width:820px;margin:0 auto}
.paper h2{font-family:Georgia,serif;text-align:center;font-size:1.15rem;margin:0 0 4px;color:#111}.paper table{width:100%;border-collapse:collapse;margin:12px 0;font-size:.82rem}.paper th,.paper td{border:1px solid #999;padding:5px 8px;text-align:left;color:#111}.paper th{background:#eee}.paper .tx{white-space:pre-wrap}
#sign{min-height:100vh;padding:20px;background:var(--bg)}#printArea{display:none}
canvas.sg{background:#fff;border-radius:6px;width:100%;max-width:420px;height:130px;touch-action:none;border:1px solid #999;display:block;margin-bottom:6px}
@page{size:A4;margin:10mm}@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important}body{background:#fff}.paper{padding:0;max-width:none}}
#toast{position:fixed;bottom:20px;right:20px;background:var(--s3);border:1px solid var(--ac);padding:10px 16px;border-radius:8px;display:none;z-index:9}
.dot{width:8px;height:8px;border-radius:50%;background:var(--yel);display:inline-block}

<script>
// ===== CONFIG =====
const GS=window.GS_URL||''; // definido em config.js
if(!/^https:/.test(GS))setTimeout(()=>alert('Configure o link do Apps Script no arquivo config.js'),400);
const SH={cats:'vn_categorias',forn:'vn_fornecedores',prods:'vn_produtos',acordos:'vn_acordos',pedidos:'vn_pedidos',ocs:'vn_ocs',contratos:'vn_contratos'};
const D={cats:[],forn:[],prods:[],acordos:[],pedidos:[],ocs:[],contratos:[]};let U={},tab='',cart={},rf={},DBOK=true;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const b64=s=>btoa(unescape(encodeURIComponent(s)));
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3200)}
// ===== BANCO (Apps Script / Google Sheets) =====
const TMO=window.GS_TIMEOUT||25000;
async function fetchT(u,o,retry){for(let t=0;;t++){const c=new AbortController(),tm=setTimeout(()=>c.abort(),TMO);
  try{const r=await fetch(u,{...o,signal:c.signal}),j=await r.json();clearTimeout(tm);return j}
  catch(e){clearTimeout(tm);if(t>=retry)throw new Error(e.name==='AbortError'?'o Apps Script não respondeu em '+Math.round(TMO/1000)+' segundos':(e.message||String(e)))}}}
async function gs(p){return fetchT(GS+'?'+new URLSearchParams(p),{redirect:'follow'},p.action==='getAll'?1:0)}
async function gsPost(b){return fetchT(GS,{method:'POST',body:JSON.stringify(b)},0)}
async function load(k){try{const rows=await gs({action:'getAll',sheet:SH[k]});D[k]=[...new Map(rows.map(r=>{try{return JSON.parse(r.json)}catch(e){return null}}).filter(Boolean).map(o=>[o.id,o])).values()];
 try{localStorage.setItem('vn_'+k,JSON.stringify(D[k]))}catch(e){}}catch(e){try{D[k]=JSON.parse(localStorage.getItem('vn_'+k)||'[]')}catch(x){D[k]=[]}DBOK=false;$('#dot').style.background='#e74c3c'}}
const LOCK={};async function lock(n,fn){if(LOCK[n])return toast('Aguarde: a operação anterior ainda está salvando...');LOCK[n]=1;try{return await fn()}finally{LOCK[n]=0}}
const SQ={};
function save(k,o){const p=(SQ[o.id]||Promise.resolve()).then(()=>save_(k,o)).catch(()=>{});SQ[o.id]=p;return p}
async function save_(k,o){const i=D[k].findIndex(x=>x.id===o.id),isNew=i<0;if(isNew)D[k].push(o);else D[k][i]=o;
 try{localStorage.setItem('vn_'+k,JSON.stringify(D[k]))}catch(e){}
 if(k==='contratos'){const d={id:o.id,json:JSON.stringify(o)};try{let r=await gsPost({action:isNew?'insert':'update',sheet:SH[k],id:o.id,data:d});if(r.status==='not_found')await gsPost({action:'insert',sheet:SH[k],data:d})}catch(e){toast('Falha ao gravar contrato')}return}
 const data=b64(JSON.stringify({id:o.id,json:JSON.stringify(o)}));
 try{const r=await gs({action:isNew?'insert':'update',sheet:SH[k],id:o.id,data,enc:'b64'});if(r.status==='not_found')await gs({action:'insert',sheet:SH[k],data,enc:'b64'})}catch(e){toast('Falha ao gravar no banco')}}
async function del(k,id){D[k]=D[k].filter(x=>x.id!==id);try{await gs({action:'delete',sheet:SH[k],id})}catch(e){}}
let UC=0;const uid=p=>p+Date.now().toString(36)+(++UC).toString(36)+Math.random().toString(36).slice(2,6);
// ===== LOGIN (mesma base de usuários do sistema Vila Nova: aba "usuarios") =====
const $e=(id,m,ok)=>{const e=$('#'+id);e.style.cssText='display:block'+(ok?';background:rgba(46,204,113,.1);border-color:rgba(46,204,113,.3);color:var(--ac)':'');e.textContent=m};
function switchLTab(t,el){document.querySelectorAll('.ltab').forEach(b=>b.classList.remove('active'));el.classList.add('active');$('#ltc-login').classList.toggle('active',t==='login');$('#ltc-register').classList.toggle('active',t==='register')}

function csvLinhas(t){const L0=t.split(/\r?\n/).find(l=>l.trim())||'',cnt=s=>L0.split(s).length-1,sep=cnt(';')>0&&cnt(';')>=cnt(',')&&cnt(';')>=cnt('\t')?';':cnt('\t')>cnt(',')?'\t':',';
 const R=[];let r=[],c='',q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch==='"')q=true;
  else if(ch===sep){r.push(c);c=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';R.push(r);r=[]}
  else c+=ch}
 if(c!==''||r.length){r.push(c);R.push(r)}
 return R.map(r=>r.map(x=>x.trim())).filter(r=>r.some(x=>x))}
async function lerTabela(f){const nm=f.name.toLowerCase();
 if(/\.xlsx?$/.test(nm)){if(!window.XLSX)throw new Error('Leitor de Excel indisponível. Salve a planilha como CSV e tente de novo.');
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''}).map(r=>r.map(x=>String(x).trim())).filter(r=>r.some(x=>x))}
 const buf=await f.arrayBuffer();let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){t=new TextDecoder('windows-1252').decode(buf)}
 return csvLinhas(t.replace(/^\ufeff/,''))}

 const t=q?(L.length?L.length+' resultado(s) encontrado(s) — clique para escolher':(av?'Nenhum resultado (item avulso)':'Nenhum resultado')):(av?'Item avulso (digitar)':'Selecione');

function dupKey(k,o){return k==='cats'?nrm(o.nome):k==='prods'?nrm(o.codigo):k==='forn'?(String(o.cnpj||'').replace(/\D/g,'')||nrm(o.nome)):k==='acordos'&&!o.encerrado?o.prod+'|'+o.forn:null}
function dupGrupos(k){const m={};D[k].forEach(o=>{const c=dupKey(k,o);if(c)(m[c]=m[c]||[]).push(o)});return Object.values(m).filter(g=>g.length>1)}
async function remap(k,from,to){const ch=[];
 if(k==='cats')D.prods.forEach(p=>{if(p.cat===from){p.cat=to;ch.push(['prods',p])}});
 if(k==='forn'){D.acordos.forEach(a=>{if(a.forn===from){a.forn=to;ch.push(['acordos',a])}});D.contratos.forEach(c=>{if(c.forn===from){c.forn=to;ch.push(['contratos',c])}});D.ocs.forEach(o=>{if(o.forn===from){o.forn=to;ch.push(['ocs',o])}})}
 if(k==='prods'){D.acordos.forEach(a=>{if(a.prod===from){a.prod=to;ch.push(['acordos',a])}});
  D.contratos.forEach(c=>{let h=0;c.itens.forEach(i=>{if(i.prod===from){i.prod=to;h=1}});if(h)ch.push(['contratos',c])});
  D.ocs.forEach(o=>{let h=0;o.itens.forEach(i=>{if(i.prod===from){i.prod=to;h=1}});if(h)ch.push(['ocs',o])});
  D.pedidos.forEach(p=>{let h=0;p.itens.concat(p.sem||[]).forEach(i=>{if(i.prod===from){i.prod=to;h=1}});if(h)ch.push(['pedidos',p])})}
 for(const c of ch)await save(c[0],c[1])}
function crudDup(k){return lock('w',async()=>{const G=dupGrupos(k),n=G.reduce((s,g)=>s+g.length-1,0);if(!n)return toast('Nenhum cadastro duplicado');
 if(!confirm('Foram encontrados '+n+' registro(s) duplicado(s). Manter o mais antigo de cada grupo, transferir os vínculos (acordos, contratos, OCs e pedidos) para ele e apagar os repetidos?'))return;
 toast('Limpando duplicados...');for(const g of G)for(const d of g.slice(1)){await remap(k,d.id,g[0].id);await del(k,d.id)}
 toast(n+' duplicado(s) removido(s)');go(k)})}

function ocsFiltradas(){const q=nrm(OFQ.q);return [...D.ocs].sort((a,b)=>b.data.localeCompare(a.data)).filter(o=>{
 if(OFQ.f&&o.forn!==OFQ.f)return false;
 if(OFQ.st==='confirmada'){const l=(D.log||[]).filter(x=>x.id===o.id).pop();if(!(l&&l.st==='confirmado'))return false}else if(OFQ.st&&o.status!==OFQ.st)return false;
 if(q&&!nrm([o.num,ocLabel(o),o.pedNum,lbl('forn',o.forn),o.setor,o.solic].join(' ')).includes(q))return false;return true})}
function ocs(){$('#main').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px"><h3>Ordens de compra <span class="tag" id="ocn"></span></h3><button class="btn" onclick="ocNova()">+ Nova OC manual</button></div>
<div class="card" style="padding:14px 16px"><div class="row" style="margin:0"><div style="flex:2"><label>Buscar por número da OC, pedido ou fornecedor</label><input id="ofq" value="${esc(OFQ.q)}" placeholder="Ex.: OC-0012, PD-0005 ou nome do fornecedor" oninput="OFQ.q=this.value;ocsLista()"></div>
<div><label>Fornecedor</label><select onchange="OFQ.f=this.value;ocsLista()">${opts('forn',OFQ.f).replace('>Selecione<','>Todos<')}</select></div>
<div><label>Situação</label><select onchange="OFQ.st=this.value;ocsLista()">${[['','Todas'],['pendente','Aguardando validação'],['validada','Validadas'],['enviada','Enviadas'],['confirmada','Confirmadas pelo fornecedor']].map(x=>`<option value="${x[0]}" ${OFQ.st===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div>
<div style="flex:0 0 auto;min-width:0"><button class="btn g" onclick="OFQ={q:'',st:'',f:''};ocs()">Limpar filtros</button></div></div></div><div id="ocl"></div>`;ocsLista()}
// ===== SEM ACORDO por pedido + CSV =====
const pcod=id=>{const p=D.prods.find(x=>x.id===id);return p?p.codigo:'?'},fq=q=>String(q).replace('.',',');
function pedCsv(pid){const p=D.pedidos.find(x=>x.id===pid);baixar('pedido_'+p.num+'.csv','codigo;quantidade\n'+p.itens.map(i=>pcod(i.prod)+';'+fq(i.qtd)).join('\n'))}
// ===== Gravação em lote (importações grandes) =====
async function saveMany(k,objs){objs.forEach(o=>{const i=D[k].findIndex(x=>x.id===o.id);if(i<0)D[k].push(o);else D[k][i]=o});try{localStorage.setItem('vn_'+k,JSON.stringify(D[k]))}catch(e){}
 for(let i=0;i<objs.length;i+=150){const part=objs.slice(i,i+150);toast('Gravando '+Math.min(i+150,objs.length)+' de '+objs.length+'...');let r;
  try{r=await gsPost({action:'batchInsert',sheet:SH[k],rows:part.map(o=>({id:o.id,json:JSON.stringify(o)}))})}catch(e){r={error:e.message}}
  if(!r||r.status!=='ok'){for(const o of part)await save_(k,o)}}}
async function testaConexao(){const t0=Date.now();$e('loginError','Testando conexão...',1);try{const r=await gs({action:'test'});$e('loginError',r.status==='ok'?'✅ Banco conectado em '+((Date.now()-t0)/1000).toFixed(1)+' s.':'⚠️ Resposta inesperada do servidor: '+JSON.stringify(r).slice(0,120),r.status==='ok')}catch(e){$e('loginError','❌ Sem conexão: '+(e.message||e)+'. Link em uso: '+GS.slice(0,48)+'…')}}
// ===== AVISO DE PEDIDO AOS MASTERS =====
function pedPayload(ped,tipo){const dt=new Date(ped.data);
 return{id:ped.id,num:ped.num,setor:ped.setor,user:ped.user,obs:ped.obs||'',tipo,data_fmt:dt.toLocaleDateString('pt-BR')+' '+dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),
  itens:ped.itens.map(i=>{const p=D.prods.find(x=>x.id===i.prod)||{codigo:'?',nome:'(produto removido)',un:''},a=best(i.prod);return{codigo:p.codigo,nome:p.nome,un:p.un,qtd:i.qtd,forn:a?lbl('forn',a.forn):'',valor:a?a.valor:null}}),
  sem:(ped.sem||[]).map(i=>pcod(i.prod)),ocs:(ped.ocs||[]).map(id=>(D.ocs.find(o=>o.id===id)||{}).num).filter(Boolean),
  solicitante_email:U.e||'',remetente_email:U.e||'',app_url:location.href.split(/[?#]/)[0]}}
function notificaPedido(ped,tipo){gsPost({action:'notifyPedido',...pedPayload(ped,tipo)}).then(r=>{
  toast(r&&r.success?'Aviso enviado por e-mail aos administradores Master (com PDF)':'Pedido salvo, mas o aviso por e-mail não foi enviado'+(r&&r.error?': '+r.error:''));loadPlog()}).catch(()=>toast('Pedido salvo, mas não foi possível confirmar o envio do aviso por e-mail'))}
async function loadPlog(){try{const r=await gs({action:'getAll',sheet:'pedido_emails_log'});D.plog=Array.isArray(r)?r:[]}catch(e){D.plog=D.plog||[]}if(tab==='meus')meus()}
function pedAviso(p){const m={};(D.plog||[]).filter(r=>String(r.pedido_id)===p.id).forEach(r=>{m[String(r.email).toLowerCase()]=r.status});const E=Object.keys(m);if(!E.length)return'<span class="mut">—</span>';
 const c=E.filter(e=>m[e]==='confirmado').length;return`<span class="tag ${c===E.length?'t-validada':c?'t-pendente':''}" title="${esc(E.map(e=>e+': '+m[e]).join('\n'))}">${c} de ${E.length} confirmaram</span>`}
// ===== BUSCA EM PEDIDOS (pedido, item, data) =====
let PSQ={q:'',d:''},SSQ={q:'',d:''};
const dtp=iso=>new Date(iso).toLocaleDateString('pt-BR'),dtiso=iso=>{const d=new Date(iso);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function pedFiltra(L,Q){const q=nrm(Q.q);return L.filter(p=>{
 if(Q.d&&dtiso(p.data)!==Q.d)return false;if(!q)return true;
 const it=(p.itens||[]).concat(p.sem||[],p.semHist||[]).map(i=>{const pr=D.prods.find(x=>x.id===i.prod);return pr?pr.codigo+' '+pr.nome:''}).join(' ');
 return nrm([p.num,p.setor,p.user,dtp(p.data),dtiso(p.data),it].join(' ')).includes(q)})}
const filtroUI=(Q,v,fn,reset)=>`<div class="row" style="margin-bottom:12px"><div style="flex:2"><label>Buscar por pedido, item ou data</label><input value="${esc(Q.q)}" placeholder="Ex.: PD-0005, peptamen, 23/10" oninput="${v}.q=this.value;${fn}()"></div><div><label>Data do pedido</label><input type="date" value="${esc(Q.d)}" onchange="${v}.d=this.value;${fn}()"></div><div style="flex:0 0 auto;min-width:0"><button class="btn g" onclick="${reset}">Limpar</button></div></div>`;
function meus(){$('#main').innerHTML=`<div class="card"><h3 style="margin-bottom:12px">${U.p==='master'?'Todos os pedidos':'Meus pedidos'} <span class="tag" id="pcn"></span></h3>${filtroUI(PSQ,'PSQ','meusLista',"PSQ={q:'',d:''};meus()")}<div id="pl"></div></div>`;meusLista()}
function meusLista(){const base=D.pedidos.filter(p=>U.p==='master'||p.setor===U.s).sort((a,b)=>b.data.localeCompare(a.data)),L=pedFiltra(base,PSQ),n=$('#pcn');if(n)n.textContent=L.length+(L.length!==base.length?' de '+base.length:'');
 $('#pl').innerHTML=`<div class="tw sc"><table><tr><th>Pedido</th><th>Setor</th><th>Data</th><th>Itens</th><th>OCs</th><th>Sem acordo</th><th>Aviso ao Compras</th><th></th></tr>${L.map(p=>`<tr><td>${p.num}${p.editadoEm?' <span class="mut">(editado)</span>':''}</td><td>${esc(p.setor)}</td><td>${dtp(p.data)}</td><td>${p.itens.length}</td><td>${p.ocs.map(id=>{const o=D.ocs.find(x=>x.id===id);return o?`<span class="tag t-${o.status}">${o.num}</span>`:''}).join(' ')||'—'}</td><td>${p.sem.length?`<span class="tag t-sem">${p.sem.map(i=>esc(lbl('prods',i.prod).split(' — ')[0])).join(', ')}</span>`:'—'}</td><td>${pedAviso(p)}</td><td style="white-space:nowrap">${editavel(p)?`<button class="btn g s" onclick="pedEdit('${p.id}')">Editar</button>`:'<span class="mut">OC em andamento</span>'} <button class="btn g s" onclick="pedCsv('${p.id}')">CSV</button></td></tr>`).join('')||`<tr><td class="empty" colspan="8">${base.length?'Nenhum pedido encontrado com essa busca.':'Nenhum pedido ainda.'}</td></tr>`}</table></div>${L.length>5?'<div class="mut" style="margin-top:8px">Role a lista para ver os demais pedidos.</div>':''}`}
function semBase(){return D.pedidos.filter(p=>(p.sem&&p.sem.length)||(p.semHist&&p.semHist.length)).sort((a,b)=>b.data.localeCompare(a.data))}
function semCsv(pid){const m={};(pid?D.pedidos.filter(p=>p.id===pid):pedFiltra(semBase(),SSQ)).forEach(p=>(p.sem||[]).forEach(i=>{const c=pcod(i.prod);m[c]=(m[c]||0)+i.qtd}));
 const L=Object.entries(m);if(!L.length)return toast('Nenhum item sem acordo para baixar');
 const p=pid&&D.pedidos.find(x=>x.id===pid);baixar(p?'pedido_'+p.num+'_sem_acordo.csv':'itens_sem_acordo_'+hoje()+'.csv','codigo;quantidade\n'+L.map(e=>e[0]+';'+fq(e[1])).join('\n'))}
function cot(){$('#main').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px"><div><h3>Itens sem acordo, por pedido <span class="tag" id="scn"></span></h3><span class="mut">Escolha fornecedor e valor para gerar a OC ou baixe o CSV (código;quantidade). "Salvar acordo" faz os próximos pedidos saírem automáticos.</span></div><button class="btn g" onclick="semCsv()">Baixar CSV dos pedidos listados</button></div><div class="card" style="padding:14px 16px;margin-bottom:12px">${filtroUI(SSQ,'SSQ','cotLista',"SSQ={q:'',d:''};cot()").replace('margin-bottom:12px','margin:0')}</div><div id="sl"></div>`;cotLista()}
function cotLista(){const base=semBase(),G=pedFiltra(base,SSQ);let x=0;const n=$('#scn');if(n)n.textContent=G.length+(G.length!==base.length?' de '+base.length:'');
 const nm=id=>{const p=D.prods.find(z=>z.id===id);return p?[p.codigo,p.nome]:['?','(produto removido)']};
 $('#sl').innerHTML=`<div style="max-height:70vh;overflow-y:auto;padding-right:6px">`+(G.map(p=>{const pend=p.sem||[],hist=p.semHist||[];return`<div class="card"><div class="row" style="margin:0 0 8px"><div><h3>${esc(p.num)} ${pend.length?`<span class="tag t-sem">${pend.length} item(ns) sem acordo</span>`:'<span class="tag t-validada">todos atendidos</span>'}</h3><span class="mut">${esc(p.setor)} · ${esc(p.user||'')} · ${dtp(p.data)}</span></div>${pend.length?`<div style="flex:0 0 auto;min-width:0;display:flex;gap:6px;margin-left:auto"><button class="btn g s" onclick="semCsv('${p.id}')">Baixar CSV</button></div>`:''}</div>
 ${pend.length?`<div class="tw sc" style="max-height:340px"><table><tr><th>Código</th><th>Item</th><th>Qtd</th><th>Fornecedor</th><th>Valor un.</th><th>Salvar acordo</th><th></th></tr>${pend.map(i=>{const k=x++,n=nm(i.prod);return`<tr><td>${esc(n[0])}</td><td>${esc(n[1])}</td><td>${i.qtd}</td><td><select id="cf${k}">${opts('forn')}</select></td><td><input class="q" id="cv${k}" type="number" step="0.01"></td><td><input type="checkbox" id="ca${k}" style="width:auto"></td><td><button class="btn s" onclick="atender('${p.id}','${i.prod}',${k})">Gerar OC</button></td></tr>`}).join('')}</table></div>${pend.length>5?'<div class="mut" style="margin-top:6px">Role a lista para ver os demais itens deste pedido.</div>':''}`:''}
 ${hist.length?`<div class="mut" style="margin-top:8px">Já atendidos: ${hist.map(h=>esc(nm(h.prod)[0])+' → '+esc(h.oc)+' ('+esc(lbl('forn',h.forn))+')').join(' · ')}</div>`:''}</div>`}).join('')||`<div class="empty">${base.length?'Nenhum pedido encontrado com essa busca.':'Nenhum pedido com itens sem acordo.'}</div>`)+`</div>`}
